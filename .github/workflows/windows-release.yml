name: Windows distribution

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build.txt
      - name: Full deterministic test suite
        run: python -m unittest discover -s tests -t . -p "test_*.py"
      - name: Generate exact third-party notices
        run: python tools/build_third_party_notices.py build/third_party
      - name: Generate Windows branding assets
        run: python tools/build_brand_assets.py build/brand
      - name: Build onedir application
        run: python -m PyInstaller --clean --noconfirm packaging/morpholabel.spec
      - name: Packaged CLI smoke
        shell: pwsh
        run: |
          .\dist\MorphoLabel\MorphoLabel.exe --version
          .\dist\MorphoLabel\MorphoLabel.exe --self-test
      - name: Packaged GUI process smoke
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\dist\MorphoLabel\MorphoLabel.exe" -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 6
          if ($p.HasExited) { throw "Packaged GUI exited during startup with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - name: Install Inno Setup 7.1.0
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup.7 --version 7.1.0 -e --scope machine --source winget --silent --accept-package-agreements --accept-source-agreements
          $iscc = Join-Path $env:ProgramFiles "Inno Setup 7\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) { throw "ISCC.exe not found after Inno Setup installation: $iscc" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Choose and verify product version
        shell: pwsh
        run: |
          $sourceVersion = python -c "from app.version import __version__; print(__version__)"
          if (-not $sourceVersion) { throw "Could not read app.version.__version__" }
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tagVersion = $env:GITHUB_REF_NAME -replace '^v',''
            if ($tagVersion -ne $sourceVersion) {
              throw "Release tag version $tagVersion does not match application version $sourceVersion"
            }
          }
          "DIST_VERSION=$sourceVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\installer | Out-Null
          & "$env:ISCC" /DMyAppVersion="$env:DIST_VERSION" packaging\windows\MorphoLabel.iss
      - name: Silent clean-install smoke
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\installer\MorphoLabel-*-Setup-x64.exe | Select-Object -First 1
          if (-not $setup) { throw "Installer was not produced" }
          $target = Join-Path $env:RUNNER_TEMP "MorphoLabel-installed"
          $proc = Start-Process -FilePath $setup.FullName -WindowStyle Hidden -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$target" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Installer failed with code $($proc.ExitCode)" }
          $exe = Join-Path $target "MorphoLabel.exe"
          if (-not (Test-Path $exe)) { throw "Installed executable missing" }
          $selfTestOut = Join-Path $env:RUNNER_TEMP "MorphoLabel-self-test.json"
          $selfTestErr = Join-Path $env:RUNNER_TEMP "MorphoLabel-self-test.stderr.txt"
          $selfTest = Start-Process -FilePath $exe -WindowStyle Hidden -ArgumentList "--self-test" -Wait -PassThru -RedirectStandardOutput $selfTestOut -RedirectStandardError $selfTestErr
          if ($selfTest.ExitCode -ne 0) { throw "Installed core self-test exited with code $($selfTest.ExitCode): $(Get-Content -Raw $selfTestErr)" }
          $selfTestReport = Get-Content -Raw -LiteralPath $selfTestOut | ConvertFrom-Json
          if ($selfTestReport.status -ne "PASS") { throw "Installed core self-test did not report PASS" }
          $gui = Start-Process -FilePath $exe -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 6
          if ($gui.HasExited) { throw "Installed GUI exited during startup with code $($gui.ExitCode)" }
          Stop-Process -Id $gui.Id -Force
          $state = Join-Path $env:LOCALAPPDATA "MorphoLabel"
          foreach ($name in @("components", "downloads", "starters", "first_run_setup.json")) {
            if (Test-Path -LiteralPath (Join-Path $state $name)) { throw "Silent smoke unexpectedly started AI setup: $name" }
          }
          $uninstaller = Join-Path $target "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller missing" }
          $un = Start-Process -FilePath $uninstaller -WindowStyle Hidden -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($un.ExitCode -ne 0) { throw "Uninstall failed with code $($un.ExitCode)" }
      - name: Record sizes and SHA256
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\installer\MorphoLabel-*-Setup-x64.exe | Select-Object -First 1
          $hash = Get-FileHash $setup.FullName -Algorithm SHA256
          "$($hash.Hash.ToLower())  $($setup.Name)" | Set-Content dist\installer\SHA256SUMS.txt
          $installedBytes = (Get-ChildItem dist\MorphoLabel -Recurse -File | Measure-Object Length -Sum).Sum
          "setup_bytes=$($setup.Length)" | Set-Content dist\installer\BUILD_SIZES.txt
          "installed_bytes=$installedBytes" | Add-Content dist\installer\BUILD_SIZES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MorphoLabel-Windows-${{ github.sha }}
          path: |
            dist/installer/MorphoLabel-*-Setup-x64.exe
            dist/installer/SHA256SUMS.txt
            dist/installer/BUILD_SIZES.txt
      - name: Attach release assets for tags
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem dist\installer\MorphoLabel-*-Setup-x64.exe | Select-Object -First 1
          gh release view "$env:GITHUB_REF_NAME" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:GITHUB_REF_NAME" --prerelease --title "$env:GITHUB_REF_NAME" --generate-notes
            if ($LASTEXITCODE -ne 0) { gh release view "$env:GITHUB_REF_NAME" | Out-Null }
          }
          gh release upload "$env:GITHUB_REF_NAME" $setup.FullName dist\installer\SHA256SUMS.txt --clobber
