name: Windows AI component

on:
  workflow_dispatch:
  push:
    paths:
      - "ai_runtime/windows-cu121-component.json"
      - "ai_runtime/rtmpose_runner.py"
      - "tools/build_ai_component.py"
      - ".github/workflows/ai-component.yml"

permissions:
  contents: write

jobs:
  build-ai:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build pinned managed AI component
        run: python tools/build_ai_component.py ai_runtime/windows-cu121-component.json dist/ai-component
      - name: Verify archive contract
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\ai-component\MorphoLabel-AI-Windows-x64-*.zip | Select-Object -First 1
          if (-not $zip) { throw "AI component archive missing" }
          if (-not (Test-Path dist\ai-component\SHA256SUMS.txt)) { throw "AI component checksum missing" }
          if (-not (Test-Path dist\ai-component\AI_BUILD_INFO.json)) { throw "AI component build info missing" }

      - name: Build public delivery manifest
        shell: pwsh
        run: |
          $build = Get-Content dist\ai-component\AI_BUILD_INFO.json -Raw | ConvertFrom-Json
          $spec = Get-Content ai_runtime\windows-cu121-component.json -Raw | ConvertFrom-Json
          $appVersion = python -c "from app.version import __version__; print(__version__)"
          $manifest = [ordered]@{
            format_version = 1
            app_version = $appVersion
            component_version = $spec.component_version
            platform = $spec.platform
            archive_name = $build.archive
            archive_sha256 = $build.archive_sha256
            archive_bytes = [int64]$build.archive_bytes
            installed_bytes = [int64]$build.installed_bytes
          }
          $manifest | ConvertTo-Json | Set-Content dist\ai-component\MorphoLabel-AI-Windows-x64.json
      - name: Managed install and bootstrap smoke
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\ai-component\MorphoLabel-AI-Windows-x64-*.zip | Select-Object -First 1
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "MorphoLabel-managed-ai"
          python -c "from app.ai_component import install_component_archive; from app.landmark_bootstrap import resolve_landmark_bootstrap; import sys; runtime=install_component_archive(sys.argv[1]); bootstrap=resolve_landmark_bootstrap(None); assert bootstrap.runtime_python.resolve()==runtime.resolve(); assert bootstrap.config_path.is_file(); assert bootstrap.checkpoint_path.is_file(); print('MANAGED_AI_INSTALL_PASS', runtime)" $zip.FullName
          if (-not (Test-Path "$env:LOCALAPPDATA\MorphoLabel\components\ai\active.json")) { throw "Managed AI active record missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: MorphoLabel-AI-Windows-x64-${{ github.sha }}
          compression-level: 0
          path: |
            dist/ai-component/MorphoLabel-AI-Windows-x64-*.zip
            dist/ai-component/SHA256SUMS.txt
            dist/ai-component/AI_BUILD_INFO.json
            dist/ai-component/MorphoLabel-AI-Windows-x64.json

      - name: Attach managed AI assets for tags
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sourceVersion = python -c "from app.version import __version__; print(__version__)"
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v',''
          if ($tagVersion -ne $sourceVersion) { throw "Release tag does not match application version" }
          gh release view "$env:GITHUB_REF_NAME" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:GITHUB_REF_NAME" --prerelease --title "$env:GITHUB_REF_NAME" --notes "Development beta."
          }
          $zip = Get-ChildItem dist\ai-component\MorphoLabel-AI-Windows-x64-*.zip | Select-Object -First 1
          gh release upload "$env:GITHUB_REF_NAME" $zip.FullName dist\ai-component\MorphoLabel-AI-Windows-x64.json dist\ai-component\AI_BUILD_INFO.json --clobber
