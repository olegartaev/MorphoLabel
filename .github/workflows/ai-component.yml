name: Windows AI component

on:
  workflow_dispatch:
  push:
    paths:
      - "ai_runtime/windows-cu121-component.json"
      - "ai_runtime/rtmpose_runner.py"
      - "tools/build_ai_component.py"
      - "app/self_test.py"
      - "app/rtmpose_dataset.py"
      - "app/landmark_bootstrap.py"
      - ".github/workflows/ai-component.yml"

permissions:
  contents: write

jobs:
  build-ai:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build pinned managed AI component
        run: python tools/build_ai_component.py ai_runtime/windows-cu121-component.json dist/ai-component
      - name: Verify archive contract
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\ai-component\MorphoLabel-AI-Windows-x64-*.zip | Select-Object -First 1
          if (-not $zip) { throw "AI component archive missing" }
          if (-not (Test-Path dist\ai-component\SHA256SUMS.txt)) { throw "AI component checksum missing" }
          if (-not (Test-Path dist\ai-component\AI_BUILD_INFO.json)) { throw "AI component build info missing" }

      - name: Managed install and bootstrap smoke
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\ai-component\MorphoLabel-AI-Windows-x64-*.zip | Select-Object -First 1
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "MorphoLabel-managed-ai"
          python -c "from app.ai_component import install_component_archive; from app.landmark_bootstrap import resolve_landmark_bootstrap; import sys; runtime=install_component_archive(sys.argv[1]); bootstrap=resolve_landmark_bootstrap(None); assert bootstrap.runtime_python.resolve()==runtime.resolve(); assert bootstrap.config_path.is_file(); assert bootstrap.checkpoint_path.is_file(); print('MANAGED_AI_INSTALL_PASS', runtime)" $zip.FullName
          if (-not (Test-Path "$env:LOCALAPPDATA\MorphoLabel\components\ai\active.json")) { throw "Managed AI active record missing" }

      - name: End-to-end managed inference and training smoke
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "MorphoLabel-managed-ai"
          $active = Get-Content "$env:LOCALAPPDATA\MorphoLabel\components\ai\active.json" -Raw | ConvertFrom-Json
          $managedPython = Join-Path "$env:LOCALAPPDATA\MorphoLabel\components\ai\$($active.version)" "python.exe"
          if (-not (Test-Path -LiteralPath $managedPython -PathType Leaf)) { throw "Managed AI Python is missing" }
          & $managedPython --version
          $report = "dist\ai-component\AI_SELF_TEST.json"
          & $managedPython -m app --ai-self-test --include-training --diagnostic-report $report
          if (-not (Test-Path $report)) { throw "AI self-test report missing" }
          $data = Get-Content $report -Raw | ConvertFrom-Json
          if ($data.status -ne "PASS") { throw "AI self-test did not pass" }
          if ($data.training_smoke.status -ne "trained") { throw "AI training smoke did not produce a checkpoint" }
          if (-not $data.training_smoke.checkpoint_sha256) { throw "AI training smoke checkpoint SHA256 missing" }
          Write-Host "MANAGED_AI_INFERENCE_TRAINING_PASS"

      - name: Reclaim smoke space and build split public delivery assets
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force (Join-Path $env:RUNNER_TEMP "MorphoLabel-managed-ai") -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force build\ai-component\runtime -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force build\ai-component\mmpose-source -ErrorAction SilentlyContinue
          $appVersion = python -c "from app.version import __version__; print(__version__)"
          python tools\build_ai_release_assets.py dist\ai-component $appVersion
          $manifest = Get-Content dist\ai-component\release-assets\MorphoLabel-AI-Windows-x64.json -Raw | ConvertFrom-Json
          foreach ($part in $manifest.parts) {
            if ([int64]$part.bytes -ge 2147483648) { throw "Release asset part exceeds GitHub 2 GiB limit" }
            if (-not (Test-Path (Join-Path "dist\ai-component\release-assets" $part.name))) { throw "Release asset part missing" }
          }
          Get-ChildItem dist\ai-component\MorphoLabel-AI-Windows-x64-*.zip | Remove-Item -Force
      - uses: actions/upload-artifact@v4
        with:
          name: MorphoLabel-AI-Windows-x64-${{ github.sha }}
          compression-level: 0
          path: |
            dist/ai-component/release-assets/*
            dist/ai-component/SHA256SUMS.txt
            dist/ai-component/AI_BUILD_INFO.json
            dist/ai-component/AI_SELF_TEST.json

      - name: Attach managed AI assets for tags
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sourceVersion = python -c "from app.version import __version__; print(__version__)"
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v',''
          if ($tagVersion -ne $sourceVersion) { throw "Release tag does not match application version" }
          gh release view "$env:GITHUB_REF_NAME" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:GITHUB_REF_NAME" --prerelease --title "$env:GITHUB_REF_NAME" --generate-notes
            if ($LASTEXITCODE -ne 0) { gh release view "$env:GITHUB_REF_NAME" | Out-Null }
          }
          $assets = Get-ChildItem dist\ai-component\release-assets -File
          foreach ($asset in $assets) {
            gh release upload "$env:GITHUB_REF_NAME" $asset.FullName --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload release asset $($asset.Name)" }
          }
          gh release upload "$env:GITHUB_REF_NAME" dist\ai-component\AI_BUILD_INFO.json --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload AI_BUILD_INFO.json" }
